; LBN Coop SA - configuracao (etapa 2)
; Linhas com ';' sao comentarios. Salve como UTF-8 sem BOM ou ANSI.
[LbnCoopSA]
; Seu apelido (1 a 24 caracteres; acentos viram letras simples)
Nickname=Amigo
; host = voce hospeda (o servidor roda dentro do seu jogo) | join = voce entra no host
Mode=join
; IP do host (usado por quem entra). Radmin VPN do LBN: 26.196.166.86
HostIP=26.196.166.86
; Porta UDP (o host precisa liberar no firewall)
Port=7810
; Modelo do seu boneco como os OUTROS te veem (ID de ped do SA). 106 = Grove (fam2).
; 0 (CJ) ainda nao e suportado para bonecos remotos.
Skin=107
; 1 = hospeda/conecta sozinho assim que o mapa carregar | 0 = aperte F7
AutoStart=0
; Pacotes de posicao por segundo (5 a 60). Padrao 30.
SendRate=30
; Atraso de interpolacao em ms (maior = mais suave, menor = mais responsivo). Padrao 120.
InterpDelayMs=120
; Tempo sem resposta ate considerar o jogador caido (ms)
TimeoutMs=10000
; 0 = bonecos dos outros jogadores NAO tem colisao (nunca prendem nem empurram voce). 1 = com colisao
RemotePedCollision=0
ShowNametags=1
NametagDistance=80
ServerName=LBN Coop SA

[Hotkeys]
; Codigos virtual-key do Windows (0x76 = F7, 0x77 = F8, 0x78 = F9, 0x79 = F10)
Start=0x76
Menu=0x77
ToggleMode=0x78
Disconnect=0x79
; F6 com o menu (F8) aberto = soltar o seu boneco (igual ao /soltar do chat)
Unstuck=0x75
Chat=T

[Mundo]
; Vale o ini do HOST: os amigos seguem as regras, a hora, o clima e o procurado do host.
; 1 = jogadores podem se ferir (tiro, soco, atropelar) | 0 = ninguem fere ninguem
PvP=1
; 1 = todos usam a hora do jogo do host
SyncClock=1
; 1 = todos usam o clima do host
SyncWeather=1
; 1 = nivel de procurado (estrelas) compartilhado, decidido pelo host
SyncWanted=1
; Densidade de transito e de pedestres em % (0 a 200). 100 = normal do jogo (nao mexe em nada).
TrafficDensity=100
PedDensity=100
; (vale para cada um) 1 = apaga a SUA copia vazia de um carro estacionado/de transito que um amigo pegou
RemoveDuplicateCars=1
